name: HamiCard CI/CD Automated Test Pipeline

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  full-system-verification:
    name: 15-Suite Master Automated Verification
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hamicard_dev
          POSTGRES_USER: hamicard
          POSTGRES_PASSWORD: hamicard_dev_secret_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install System Utilities & Postgres Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Apply Database Schema & Seed Data
        run: |
          PGPASSWORD=hamicard_dev_secret_pass psql -h localhost -U hamicard -d hamicard_dev -f db/init.sql

      - name: Run Master Automated Test Suite (15 Suites / 84 Tests)
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql://hamicard:hamicard_dev_secret_pass@localhost:5432/hamicard_dev
          REDIS_URL: redis://localhost:6379/0
        run: |
          python scripts/run_all_tests.py
