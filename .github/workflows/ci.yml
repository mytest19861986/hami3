name: HamiCard CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  database-and-concurrency-tests:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hamicard_dev
          POSTGRES_USER: hamicard
          POSTGRES_PASSWORD: hamicard_dev_secret_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install asyncpg redis pytest

      - name: Apply Database Schema & Seed Data
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=hamicard_dev_secret_pass psql -h localhost -U hamicard -d hamicard_dev -f db/init.sql

      - name: Run Database & Concurrency Verification Test Suite
        run: |
          python tests/test_phase1_database.py
