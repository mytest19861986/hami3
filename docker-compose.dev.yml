services:
  postgres:
    image: postgres:16-alpine
    container_name: hamicard_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-hamicard_dev}
      POSTGRES_USER: ${DB_USER:-hamicard}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hamicard_dev_secret_pass}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hamicard} -d ${DB_NAME:-hamicard_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2048M

  redis:
    image: redis:7-alpine
    container_name: hamicard_redis_dev
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 384mb --maxmemory-policy volatile-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

volumes:
  postgres_dev_data:
    name: hamicard_postgres_dev_data
  redis_dev_data:
    name: hamicard_redis_dev_data
